<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soundshop — Presets Gallery</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header>
    <h1>Presets Gallery</h1>
    <p>Every preset for the Flagship Synth, with its full parameters.</p>
  </header>

  <!-- Shared site navigation. The same block appears on all four pages with
       paths relative to that page's directory, so both serving roots (the
       repository root and site/) keep working. The current page is marked
       statically with class="current" + aria-current="page" — no JavaScript. -->
  <nav class="site-nav" aria-label="Site">
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="../plugins/flagship.html">Flagship Synth</a></li>
      <li><a class="current" aria-current="page" href="index.html">Presets</a></li>
      <li><a href="../changelog.html">Changelog</a></li>
    </ul>
  </nav>

  <main>
    <section id="gallery">
      <h2>Presets</h2>
      <div id="search-box">
        <label for="preset-search">Search presets</label>
        <div class="search-row">
          <input type="text" id="preset-search" placeholder="Search by name, author or param…" autocomplete="off">
          <!-- Clear control and result count are hidden until the gallery has
               rendered and the filter is wired, so a no-JS (or failed fetch)
               page never shows dead controls. -->
          <button type="button" id="preset-clear" hidden>Clear</button>
        </div>
        <p id="preset-count" role="status" aria-live="polite" hidden></p>
      </div>
      <div id="presets-gallery">Loading presets…</div>
    </section>
  </main>
  <script>
    // Load and render the full presets gallery, including params.
    // Same defensive fetch/catch pattern as site/plugins/flagship.html.
    (function(){
      // Slug helper: turns a preset name into a stable, URL-safe id fragment.
      // Duplicated (identically) in site/plugins/flagship.html so both pages
      // stay standalone with no build step. Keep the two copies in sync.
      function slugify(s){
        return String(s || 'untitled preset')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'preset';
      }

      // Web Audio support is checked once. When it is missing the gallery
      // simply renders no Preview buttons — the same silently-degrading
      // pattern the page already uses when a fetch fails.
      var AudioCtx = window.AudioContext || window.webkitAudioContext;

      // Map a preset's osc1 value onto an OscillatorNode type. Anything the
      // browser cannot play falls back to 'sawtooth'.
      function waveFor(v){
        var w = String(v == null ? '' : v).trim().toLowerCase();
        if(w === 'saw' || w === 'sawtooth') return 'sawtooth';
        if(w === 'sine' || w === 'square' || w === 'triangle') return w;
        return 'sawtooth';
      }

      // Map a preset's filter value onto a low-pass cutoff in Hz, clamped to
      // the audible range so a stray value cannot produce silence or a screech.
      function cutoffFor(v){
        var n = Number(v);
        if(!isFinite(n) || n <= 0) return 2000;
        return Math.min(20000, Math.max(20, n));
      }

      fetch('flagship-presets.json')
        .then(function(r){ if(!r.ok) throw new Error('fetch failed'); return r.json(); })
        .then(function(data){
          var el = document.getElementById('presets-gallery');
          if(!Array.isArray(data) || data.length === 0) { el.textContent = 'No presets found.'; return; }
          var wrap = document.createElement('div');
          wrap.className = 'preset-cards';
          var seen = {};
          data.forEach(function(p){
            var card = document.createElement('div');
            card.className = 'preset-card';

            // Stable per-card id: 'preset-<slug>', with -2/-3 suffixes when two
            // presets slugify to the same value. Both pages walk
            // flagship-presets.json in the same order, so the suffixes match.
            var base = slugify(p.name);
            seen[base] = (seen[base] || 0) + 1;
            var slug = seen[base] > 1 ? base + '-' + seen[base] : base;
            card.id = 'preset-' + slug;

            var name = document.createElement('h3');
            name.textContent = p.name || 'Untitled preset';
            card.appendChild(name);

            var author = document.createElement('p');
            author.textContent = 'By ' + (p.author || 'unknown');
            card.appendChild(author);

            // Tag chips. Each tag becomes a button that types itself into the
            // existing search box (see the delegated click handler below), so
            // the gallery is browsable by category without a second filter.
            // Read defensively: presets without a tags array render unchanged.
            var tags = Array.isArray(p.tags) ? p.tags : [];
            var cleanTags = [];
            tags.forEach(function(t){
              var tag = String(t == null ? '' : t).trim().toLowerCase();
              if(tag && cleanTags.indexOf(tag) === -1) cleanTags.push(tag);
            });
            if(cleanTags.length){
              var tagBar = document.createElement('p');
              tagBar.className = 'preset-tags';
              cleanTags.forEach(function(tag){
                var chip = document.createElement('button');
                chip.type = 'button';
                chip.className = 'tag-chip';
                chip.textContent = tag;
                chip.setAttribute('data-tag', tag);
                chip.setAttribute('aria-label', 'Search presets for ' + tag);
                tagBar.appendChild(chip);
              });
              card.appendChild(tagBar);
            }

            var params = p.params && typeof p.params === 'object' ? p.params : {};
            var keys = Object.keys(params);
            if(keys.length){
              var dl = document.createElement('dl');
              keys.forEach(function(k){
                var dt = document.createElement('dt');
                dt.textContent = k;
                var dd = document.createElement('dd');
                dd.textContent = String(params[k]);
                dl.appendChild(dt);
                dl.appendChild(dd);
              });
              card.appendChild(dl);
            }

            // Snapshot the searchable text BEFORE the permalink is added, so
            // the permalink's '#' never matches a search query.
            card.setAttribute('data-search', (card.textContent || '').toLowerCase());

            // Per-preset preview button. Added AFTER the search snapshot above
            // so the word "Preview" never becomes a search match — the same
            // reason the permalink is appended here. The button carries the two
            // values the preview needs, so the click handler never has to look
            // the preset up again. No button when Web Audio is unavailable or
            // when the preset has no osc1/filter to sound.
            if(AudioCtx && params.osc1 != null && params.filter != null){
              var play = document.createElement('button');
              play.type = 'button';
              play.className = 'preset-play';
              play.textContent = 'Preview';
              play.setAttribute('data-osc', waveFor(params.osc1));
              play.setAttribute('data-cutoff', String(cutoffFor(params.filter)));
              play.setAttribute('aria-pressed', 'false');
              play.title = 'Approximate preview: one note through this preset’s waveform and filter';
              play.setAttribute('aria-label', 'Preview ' + (p.name || 'Untitled preset') + ' (approximate)');
              card.appendChild(play);
            }

            var permalink = document.createElement('a');
            permalink.className = 'preset-permalink';
            permalink.href = '#' + card.id;
            permalink.textContent = '#';
            permalink.setAttribute('aria-label', 'Permalink to ' + (p.name || 'Untitled preset'));
            card.appendChild(permalink);

            wrap.appendChild(card);
          });
          el.textContent = '';
          el.appendChild(wrap);

          // Live search/filter: match card text (name, author, params) against
          // the search box. The whole filter lives in applyFilter() so it can
          // run at load as well as on every keystroke — browsers that restore
          // form values on reload or back/forward (Firefox does) would
          // otherwise show a query in the box above the full, unfiltered list.
          var search = document.getElementById('preset-search');
          var clearBtn = document.getElementById('preset-clear');
          var count = document.getElementById('preset-count');
          var cards = Array.prototype.slice.call(wrap.getElementsByClassName('preset-card'));

          function plural(n){ return n === 1 ? 'preset' : 'presets'; }

          // Filters the cards against the current query, updates the status
          // line and the clear button, and returns how many cards are visible.
          function applyFilter(){
            var raw = search ? search.value.trim() : '';
            var q = raw.toLowerCase();
            var visible = 0;
            cards.forEach(function(card){
              var match = !q || (card.getAttribute('data-search') || '').indexOf(q) !== -1;
              card.style.display = match ? '' : 'none';
              if(match) visible++;
            });
            if(count){
              var msg;
              if(visible === 0) msg = q ? 'No presets match “' + raw + '”.' : 'No presets found.';
              else if(q) msg = 'Showing ' + visible + ' of ' + cards.length + ' ' + plural(cards.length) + '.';
              else msg = 'Showing all ' + cards.length + ' ' + plural(cards.length) + '.';
              // Only write when the text actually changes: this is a polite
              // live region, and rewriting it on every keystroke would make
              // screen readers chatter.
              if(msg !== count.textContent) count.textContent = msg;
              count.hidden = false;
            }
            if(clearBtn) clearBtn.hidden = !raw;
            // A preview whose card has just been filtered away should not keep
            // sounding from an invisible card.
            if(current && current.btn.parentNode && current.btn.parentNode.style.display === 'none') stopCurrent();
            return visible;
          }

          // Preview audio. One AudioContext for the whole page, created lazily
          // on the first click so browser autoplay policy is satisfied, and one
          // voice at a time: starting a preview stops whatever is sounding.
          var audioCtx = null;
          var current = null; // { btn, osc, filter, gain, timer }
          var DUR = 1.2;      // seconds of tone per preview

          function release(entry){
            if(!entry) return;
            if(entry.timer){ clearTimeout(entry.timer); entry.timer = null; }
            try { entry.osc.disconnect(); entry.filter.disconnect(); entry.gain.disconnect(); } catch(err){}
            entry.btn.setAttribute('aria-pressed', 'false');
            if(current === entry) current = null;
          }

          function stopCurrent(){
            var entry = current;
            if(!entry) return;
            current = null;
            try {
              var now = audioCtx.currentTime;
              entry.gain.gain.cancelScheduledValues(now);
              entry.gain.gain.setValueAtTime(entry.gain.gain.value || 0.0001, now);
              entry.gain.gain.linearRampToValueAtTime(0.0001, now + 0.03);
              entry.osc.stop(now + 0.05);
            } catch(err){}
            entry.btn.setAttribute('aria-pressed', 'false');
            // Let the short release ramp finish before the nodes are torn down,
            // so stopping a preview fades out instead of clicking.
            if(entry.timer) clearTimeout(entry.timer);
            entry.timer = setTimeout(function(){ release(entry); }, 200);
          }

          function preview(btn){
            var again = !!(current && current.btn === btn);
            stopCurrent();
            if(again) return; // clicking a sounding preview stops it
            if(!AudioCtx) return;
            if(!audioCtx){
              try { audioCtx = new AudioCtx(); } catch(err){ return; }
            }
            if(audioCtx.state === 'suspended' && typeof audioCtx.resume === 'function'){
              try { audioCtx.resume(); } catch(err){}
            }
            try {
              var t0 = audioCtx.currentTime;
              var osc = audioCtx.createOscillator();
              osc.type = btn.getAttribute('data-osc') || 'sawtooth';
              osc.frequency.setValueAtTime(220, t0);

              var filter = audioCtx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(cutoffFor(btn.getAttribute('data-cutoff')), t0);

              // Short attack and release so the note neither clicks nor sits
              // loud: peak is 0.15, well under full scale.
              var gain = audioCtx.createGain();
              gain.gain.setValueAtTime(0.0001, t0);
              gain.gain.linearRampToValueAtTime(0.15, t0 + 0.02);
              gain.gain.setValueAtTime(0.15, t0 + DUR - 0.15);
              gain.gain.linearRampToValueAtTime(0.0001, t0 + DUR);

              osc.connect(filter);
              filter.connect(gain);
              gain.connect(audioCtx.destination);
              osc.start(t0);
              osc.stop(t0 + DUR);

              var entry = { btn: btn, osc: osc, filter: filter, gain: gain, timer: null };
              osc.onended = function(){ release(entry); };
              // Fallback for engines that do not fire onended reliably.
              entry.timer = setTimeout(function(){ release(entry); }, (DUR + 0.2) * 1000);
              btn.setAttribute('aria-pressed', 'true');
              current = entry;
            } catch(err){
              current = null;
              btn.setAttribute('aria-pressed', 'false');
            }
          }

          // One delegated click handler for the cards. A tag chip puts its word
          // in the existing search box and re-runs the same filter, so there is
          // no second filter dimension and no extra state to keep; a Preview
          // button plays that preset's short approximation.
          wrap.addEventListener('click', function(e){
            var t = e.target;
            if(!t) return;
            if(t.className === 'preset-play'){ preview(t); return; }
            if(t.className !== 'tag-chip') return;
            if(!search) return;
            search.value = t.getAttribute('data-tag') || '';
            applyFilter();
            if(typeof search.focus === 'function') search.focus();
          });

          if(search){
            // Filter once now, so a restored query is honoured immediately.
            applyFilter();
            search.addEventListener('input', function(){ applyFilter(); });
            search.addEventListener('keydown', function(e){
              var key = e.key || e.keyCode;
              if((key === 'Escape' || key === 'Esc' || key === 27) && search.value !== ''){
                if(typeof e.preventDefault === 'function') e.preventDefault();
                clearSearch();
              }
            });
          }

          function clearSearch(){
            if(!search) return;
            search.value = '';
            applyFilter();
            if(typeof search.focus === 'function') search.focus();
          }

          if(clearBtn) clearBtn.addEventListener('click', clearSearch);

          // Deep links: when the URL carries #preset-<slug>, make sure that
          // card is visible and scroll it into view. If an active query has
          // filtered the card out, clear the query and re-run the filter — the
          // page then shows a consistent state (empty box, full list) instead
          // of one force-shown card under a query that excludes it.
          function applyHash(){
            var id = (location.hash || '').replace(/^#/, '');
            if(!id) return;
            var target = document.getElementById(id);
            if(!target || target.className.indexOf('preset-card') === -1) return;
            if(target.style.display === 'none'){
              if(search) search.value = '';
              applyFilter();
            }
            if(typeof target.scrollIntoView === 'function') target.scrollIntoView();
          }
          applyHash();
          window.addEventListener('hashchange', applyHash);
        }).catch(function(){
          document.getElementById('presets-gallery').textContent = 'Unable to load presets.';
        });
    })();
  </script>
</body>
</html>
