<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soundshop — Presets Gallery</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header>
    <h1>Presets Gallery</h1>
    <p>Every preset for the Flagship Synth, with its full parameters.</p>
  </header>

  <!-- Shared site navigation. The same block appears on all four pages with
       paths relative to that page's directory, so both serving roots (the
       repository root and site/) keep working. The current page is marked
       statically with class="current" + aria-current="page" — no JavaScript. -->
  <nav class="site-nav" aria-label="Site">
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="../plugins/flagship.html">Flagship Synth</a></li>
      <li><a class="current" aria-current="page" href="index.html">Presets</a></li>
      <li><a href="../changelog.html">Changelog</a></li>
    </ul>
  </nav>

  <main>
    <section id="gallery">
      <h2>Presets</h2>
      <div id="search-box">
        <label for="preset-search">Search presets</label>
        <div class="search-row">
          <input type="text" id="preset-search" placeholder="Search by name, author or param…" autocomplete="off">
          <!-- Clear control and result count are hidden until the gallery has
               rendered and the filter is wired, so a no-JS (or failed fetch)
               page never shows dead controls. -->
          <button type="button" id="preset-clear" hidden>Clear</button>
        </div>
        <!-- Tag chips are built from the tags in flagship-presets.json after the
             gallery renders; the container stays hidden until then (same rule as
             the Clear button) so no-JS visitors never see an empty control. -->
        <div id="preset-tags" class="tag-filter" role="group" aria-label="Filter presets by tag" hidden></div>
        <p id="preset-count" role="status" aria-live="polite" hidden></p>
      </div>
      <div id="presets-gallery">Loading presets…</div>
    </section>
  </main>
  <script>
    // Load and render the full presets gallery, including params.
    // Same defensive fetch/catch pattern as site/plugins/flagship.html.
    (function(){
      // Slug helper: turns a preset name into a stable, URL-safe id fragment.
      // Duplicated (identically) in site/plugins/flagship.html so both pages
      // stay standalone with no build step. Keep the two copies in sync.
      function slugify(s){
        return String(s || 'untitled preset')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '') || 'preset';
      }

      fetch('flagship-presets.json')
        .then(function(r){ if(!r.ok) throw new Error('fetch failed'); return r.json(); })
        .then(function(data){
          var el = document.getElementById('presets-gallery');
          if(!Array.isArray(data) || data.length === 0) { el.textContent = 'No presets found.'; return; }
          var wrap = document.createElement('div');
          wrap.className = 'preset-cards';
          var seen = {};
          // Unique tag vocabulary, in order of first appearance in the JSON.
          var allTags = [];
          var tagSeen = {};
          data.forEach(function(p){
            var card = document.createElement('div');
            card.className = 'preset-card';

            // Stable per-card id: 'preset-<slug>', with -2/-3 suffixes when two
            // presets slugify to the same value. Both pages walk
            // flagship-presets.json in the same order, so the suffixes match.
            var base = slugify(p.name);
            seen[base] = (seen[base] || 0) + 1;
            var slug = seen[base] > 1 ? base + '-' + seen[base] : base;
            card.id = 'preset-' + slug;

            var name = document.createElement('h3');
            name.textContent = p.name || 'Untitled preset';
            card.appendChild(name);

            var author = document.createElement('p');
            author.textContent = 'By ' + (p.author || 'unknown');
            card.appendChild(author);

            // Tags are optional: a preset without a "tags" array renders
            // exactly as before and simply never matches a tag filter.
            var tags = Array.isArray(p.tags) ? p.tags : [];
            tags = tags.map(function(t){ return String(t || '').trim().toLowerCase(); })
                       .filter(function(t){ return t !== ''; });
            if(tags.length){
              var tagList = document.createElement('p');
              tagList.className = 'preset-tags';
              tags.forEach(function(t){
                var chip = document.createElement('span');
                chip.className = 'tag-chip';
                chip.textContent = t;
                tagList.appendChild(chip);
                if(!tagSeen[t]){ tagSeen[t] = true; allTags.push(t); }
              });
              card.appendChild(tagList);
            }
            // Exact-match key for the tag filter: '|pad|warm|' contains '|pad|'
            // but never matches a tag that is only a substring of another.
            card.setAttribute('data-tags', tags.length ? '|' + tags.join('|') + '|' : '');

            var params = p.params && typeof p.params === 'object' ? p.params : {};
            var keys = Object.keys(params);
            if(keys.length){
              var dl = document.createElement('dl');
              keys.forEach(function(k){
                var dt = document.createElement('dt');
                dt.textContent = k;
                var dd = document.createElement('dd');
                dd.textContent = String(params[k]);
                dl.appendChild(dt);
                dl.appendChild(dd);
              });
              card.appendChild(dl);
            }

            // Snapshot the searchable text BEFORE the permalink is added, so
            // the permalink's '#' never matches a search query.
            card.setAttribute('data-search', (card.textContent || '').toLowerCase());

            var permalink = document.createElement('a');
            permalink.className = 'preset-permalink';
            permalink.href = '#' + card.id;
            permalink.textContent = '#';
            permalink.setAttribute('aria-label', 'Permalink to ' + (p.name || 'Untitled preset'));
            card.appendChild(permalink);

            wrap.appendChild(card);
          });
          el.textContent = '';
          el.appendChild(wrap);

          // Live search/filter: match card text (name, author, params) against
          // the search box. The whole filter lives in applyFilter() so it can
          // run at load as well as on every keystroke — browsers that restore
          // form values on reload or back/forward (Firefox does) would
          // otherwise show a query in the box above the full, unfiltered list.
          var search = document.getElementById('preset-search');
          var clearBtn = document.getElementById('preset-clear');
          var count = document.getElementById('preset-count');
          var tagBar = document.getElementById('preset-tags');
          var cards = Array.prototype.slice.call(wrap.getElementsByClassName('preset-card'));

          // The one active tag, or '' for "all tags". One tag at a time keeps
          // the two-dimensional filter (text AND tag) easy to reason about.
          var activeTag = '';
          var tagButtons = [];

          function plural(n){ return n === 1 ? 'preset' : 'presets'; }

          // Filters the cards against the current query, updates the status
          // line and the clear button, and returns how many cards are visible.
          function applyFilter(){
            var raw = search ? search.value.trim() : '';
            var q = raw.toLowerCase();
            var visible = 0;
            cards.forEach(function(card){
              var textMatch = !q || (card.getAttribute('data-search') || '').indexOf(q) !== -1;
              var tagMatch = !activeTag ||
                (card.getAttribute('data-tags') || '').indexOf('|' + activeTag + '|') !== -1;
              var match = textMatch && tagMatch;
              card.style.display = match ? '' : 'none';
              if(match) visible++;
            });
            // Keep the chips' pressed state in step with activeTag.
            tagButtons.forEach(function(btn){
              var on = btn.getAttribute('data-tag') === activeTag;
              btn.setAttribute('aria-pressed', on ? 'true' : 'false');
              btn.className = on ? 'tag-chip tag-button is-active' : 'tag-chip tag-button';
            });
            if(count){
              var msg;
              // Describe whichever filters are actually on, so "no results"
              // never looks like the gallery is empty.
              var what = q && activeTag ? '“' + raw + '” in ' + activeTag
                       : q ? '“' + raw + '”'
                       : activeTag ? 'tag ' + activeTag : '';
              if(visible === 0) msg = what ? 'No presets match ' + what + '.' : 'No presets found.';
              else if(what) msg = 'Showing ' + visible + ' of ' + cards.length + ' ' + plural(cards.length) + '.';
              else msg = 'Showing all ' + cards.length + ' ' + plural(cards.length) + '.';
              // Only write when the text actually changes: this is a polite
              // live region, and rewriting it on every keystroke would make
              // screen readers chatter.
              if(msg !== count.textContent) count.textContent = msg;
              count.hidden = false;
            }
            // Clear is offered whenever *either* filter is on.
            if(clearBtn) clearBtn.hidden = !raw && !activeTag;
            return visible;
          }

          // Build one toggle chip per tag found in the data. Clicking the
          // active chip again turns the tag filter off.
          if(tagBar && allTags.length){
            allTags.forEach(function(t){
              var btn = document.createElement('button');
              btn.type = 'button';
              btn.className = 'tag-chip tag-button';
              btn.setAttribute('data-tag', t);
              btn.setAttribute('aria-pressed', 'false');
              btn.textContent = t;
              btn.addEventListener('click', function(){
                activeTag = (activeTag === t) ? '' : t;
                applyFilter();
              });
              tagBar.appendChild(btn);
              tagButtons.push(btn);
            });
            tagBar.hidden = false;
          }

          if(search){
            // Filter once now, so a restored query is honoured immediately.
            applyFilter();
            search.addEventListener('input', function(){ applyFilter(); });
            search.addEventListener('keydown', function(e){
              var key = e.key || e.keyCode;
              if((key === 'Escape' || key === 'Esc' || key === 27) && (search.value !== '' || activeTag)){
                if(typeof e.preventDefault === 'function') e.preventDefault();
                clearSearch();
              }
            });
          }

          // Clears both filters at once — the query and the active tag — so the
          // page can never sit in a half-cleared state.
          function clearSearch(){
            activeTag = '';
            if(search) search.value = '';
            applyFilter();
            if(search && typeof search.focus === 'function') search.focus();
          }

          if(clearBtn) clearBtn.addEventListener('click', clearSearch);

          // Deep links: when the URL carries #preset-<slug>, make sure that
          // card is visible and scroll it into view. If an active query or tag
          // has filtered the card out, clear both and re-run the filter — the
          // page then shows a consistent state (empty box, full list) instead
          // of one force-shown card under a query that excludes it.
          function applyHash(){
            var id = (location.hash || '').replace(/^#/, '');
            if(!id) return;
            var target = document.getElementById(id);
            if(!target || target.className.indexOf('preset-card') === -1) return;
            if(target.style.display === 'none'){
              activeTag = '';
              if(search) search.value = '';
              applyFilter();
            }
            if(typeof target.scrollIntoView === 'function') target.scrollIntoView();
          }
          applyHash();
          window.addEventListener('hashchange', applyHash);
        }).catch(function(){
          document.getElementById('presets-gallery').textContent = 'Unable to load presets.';
        });
    })();
  </script>
</body>
</html>
