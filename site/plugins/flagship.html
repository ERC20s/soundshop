<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VANTA — 8-voice virtual-analog polysynth — SOUNDSHOP</title>
<meta name="description" content="VANTA is SOUNDSHOP's flagship: eight independent virtual-analog voices, two filters in one path, a 24-slot modulation matrix and per-voice analog error. Version 1.4.0, $149, VST3 / AU / AAX / CLAP. Play it in the browser before you buy.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316191C'/%3E%3Crect x='5.5' y='5.5' width='21' height='21' rx='3.5' fill='none' stroke='%23363D44'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23F2A93B'/%3E%3Crect x='15' y='4' width='2' height='5' rx='1' fill='%23363D44'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* Header: keep the theme toggle to the right of the nav on desktop and
     beside the burger on mobile. */
  .site-head > .theme-toggle { flex: none; }
  @media (max-width: 899px) {
    .site-head > .theme-toggle { margin-inline-start: auto; }
    .site-head > .nav-toggle   { margin-inline-start: var(--sp-3); }
  }
  /* ---------------------------------------------------------------------
     Page-local styles for the VANTA product page only. Everything here is
     either a composition of design-system tokens or a component that exists
     nowhere else on the site (the faceplate, the signal-flow diagram, the
     spec tablist, the purchase panel). Nothing overrides the shared sheet.
     --------------------------------------------------------------------- */

  /* --- in-page section nav ---------------------------------------------- */
  .subnav {
    position: sticky;
    top: var(--head-h);
    z-index: 60;
    border-bottom: 1px solid var(--line);
    background: color-mix(in oklab, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(12px) saturate(1.1);
    backdrop-filter: blur(12px) saturate(1.1);
  }
  .subnav__inner {
    display: flex;
    gap: var(--sp-5);
    align-items: center;
    overflow-x: auto;
    scrollbar-width: none;
    padding-block: var(--sp-3);
  }
  .subnav__inner::-webkit-scrollbar { display: none; }
  .subnav a {
    position: relative;
    flex: none;
    padding-block: var(--sp-1);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-mute);
    white-space: nowrap;
    transition: color var(--dur-2) var(--ease-mech);
  }
  .subnav a::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -2px;
    height: 1px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--dur-2) var(--ease-mech);
  }
  .subnav a:hover { color: var(--text); }
  .subnav a.is-active { color: var(--accent-text); }
  .subnav a.is-active::after { transform: scaleX(1); }

  /* --- hero faceplate ---------------------------------------------------- */
  .fp { display: flex; flex-direction: column; gap: var(--sp-5); margin: 0; }
  .fp__head {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
  }
  .fp__voices { display: flex; gap: 5px; align-items: center; }
  .fp__screen { position: relative; padding: var(--sp-4); }
  .fp__screen svg { display: block; width: 100%; height: auto; }
  .fp__trace { fill: none; stroke: var(--accent-2); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .fp__trace--ghost { stroke: var(--accent-2-dim); stroke-width: 1; opacity: .55; }
  .fp__axis { stroke: var(--line-soft); stroke-width: 1; }
  .fp__readout {
    position: absolute;
    left: var(--sp-4); top: var(--sp-3);
    display: flex; gap: var(--sp-4);
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: var(--fs-micro);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-2);
    pointer-events: none;
  }
  .fp__knobs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
    gap: var(--sp-4) var(--sp-3);
    justify-items: center;
  }
  .fp__foot { display: grid; gap: var(--sp-2); }
  .fp figcaption {
    font-family: var(--font-mono);
    font-size: var(--fs-micro);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-mute);
  }

  /* --- stats row --------------------------------------------------------- */
  .statrow {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--gap);
    padding-block: var(--sp-6);
    border-block: 1px solid var(--line);
  }
  @media (max-width: 719px) { .statrow { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

  /* --- demo slot --------------------------------------------------------- */
  .demo-slot { overflow: hidden; min-height: 220px; display: grid; }
  .demo-slot__fallback {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--sp-4);
    padding: clamp(24px, 4vw, 48px);
    max-width: 62ch;
  }
  .demo-slot iframe { display: block; width: 100%; border: 0; }

  /* --- signal-flow diagram ---------------------------------------------- */
  .sigflow { display: block; width: 100%; min-width: 1080px; height: auto; color: var(--text-mute); }
  .sigflow .sf-box { fill: var(--panel-hi); stroke: var(--line-strong); stroke-width: 1; }
  .sigflow .sf-box--src { fill: var(--bg-2); }
  .sigflow .sf-box--mod { fill: color-mix(in oklab, var(--accent-2) 10%, var(--bg-2)); stroke: var(--accent-2-dim); }
  .sigflow .sf-box--out { fill: var(--accent-a12); stroke: var(--accent-a35); }
  .sigflow .sf-title {
    fill: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }
  .sigflow .sf-sub {
    fill: var(--text-mute);
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
  }
  .sigflow .sf-wire { fill: none; stroke: currentColor; stroke-width: 1.5; }
  .sigflow .sf-node { fill: currentColor; }
  .sigflow .sf-mod { fill: none; stroke: var(--accent-2); stroke-width: 1.25; stroke-dasharray: 5 4; }
  .sigflow .sf-mod-label {
    fill: var(--accent-2);
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.16em;
  }
  .sigflow .sf-tip { fill: currentColor; }
  .sigflow .sf-tip-mod { fill: var(--accent-2); }
  .sigflow .sf-legend {
    fill: var(--text-mute);
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
  }

  /* --- spec tablist ------------------------------------------------------ */
  .tabs__list {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-2);
    margin-block-end: var(--sp-5);
  }
  .tabs__btn {
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    background: var(--bg-2);
    font-family: var(--font-mono);
    font-size: var(--fs-label);
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-mute);
    cursor: pointer;
    transition: color var(--dur-2) var(--ease-mech),
                border-color var(--dur-2) var(--ease-mech),
                background var(--dur-2) var(--ease-mech);
  }
  .tabs__btn:hover { color: var(--text); border-color: var(--line-strong); }
  /* The shared sheet gives .spec-table an explicit display, which would out-rank
     the UA rule for [hidden]. This puts the tab panels back under script control. */
  [role="tabpanel"][hidden] { display: none; }
  .tabs__btn[aria-selected="true"] {
    color: var(--accent-text);
    border-color: var(--accent-a35);
    background: var(--accent-a12);
  }

  /* --- presets teaser ---------------------------------------------------- */
  .preset__main { min-width: 0; }
  .preset__side { display: flex; align-items: center; }
  .preset-list { display: grid; gap: var(--sp-3); }

  /* --- purchase panel ---------------------------------------------------- */
  .buy-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); }
  @media (max-width: 899px) { .buy-grid { grid-template-columns: minmax(0, 1fr); } }
  .buy-option { display: flex; flex-direction: column; gap: var(--sp-4); height: 100%; }
  .buy-option__price { display: flex; align-items: baseline; gap: var(--sp-3); flex-wrap: wrap; }
  .buy-list { display: grid; gap: var(--sp-3); font-size: var(--fs-small); color: var(--text-dim); }
  .buy-list > li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: var(--sp-3); }
  .buy-list > li::before {
    content: "";
    width: 6px; height: 6px;
    margin-block-start: 0.55em;
    border-radius: 50%;
    background: var(--accent);
  }
  .xsell { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
  .buy-option__foot { margin-block-start: auto; padding-block-start: var(--sp-2); }

  /* --- misc -------------------------------------------------------------- */
  .kv { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-5); }
  .faq-list summary { cursor: pointer; }
</style>
</head>
