<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugins — SOUNDSHOP</title>
<link rel="stylesheet" href="../assets/style.css">
<style>
  /* Minimal page-local overrides for the store block */
  #group-store { min-height: 2.5rem; }
  #group-store > div { font-family: var(--font-sans) !important; font-size: var(--fs-small) !important; padding: 8px 0; color: var(--text-dim); }
  #group-store b { color: var(--text); }
  #group-store a[data-item] { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 999px; text-decoration: none; }
  .store-bought-line { font:13px system-ui,sans-serif; color:#9ca3af; margin:0; }
</style>
</head>
<body>
<header class="site-head">
  <a class="brand" href="../index.html">SOUNDSHOP</a>
  <nav class="site-nav"><a href="../plugins/index.html">Plugins</a> <a href="../docs.html">Docs</a></nav>
</header>
<main id="main">
  <section id="buy">
    <h2>Buy</h2>
    <div id="buy-return" class="note" hidden role="status" aria-live="polite"></div>

    <div id="group-store"></div>

    <script>
    (function () {
      // Return banner: read the return keys and set data-buy-return and data-buy-item.
      var box = document.getElementById('buy-return');
      if (!box) return;
      try {
        var OK = ["1","true","yes","ok","success","succeeded","paid","complete","completed"];
        var NO = ["0","false","cancel","cancelled","canceled","fail","failed","failure","error"];
        var PENDING = ["pending","processing","in_progress","requires_action","awaiting_payment"];
        var KEYS = ["paid","checkout","payment","status","redirect_status"];
        var q = new URLSearchParams(location.search);
        var good=false,bad=false,pend=false,seen=false;
        for (var i=0;i<KEYS.length;i++){
          if (!q.has(KEYS[i])) continue;
          seen=true;
          var v=String(q.get(KEYS[i])||"").trim().toLowerCase();
          if (OK.indexOf(v)>-1) good=true;
          else if (NO.indexOf(v)>-1) bad=true;
          else if (PENDING.indexOf(v)>-1) pend=true;
          else pend=true;
        }
        if (!seen && q.has('session_id') && String(q.get('session_id')||"").trim()) { seen=true; good=true; }
        if (!seen || (!good && !bad && !pend)) return;
        if (bad) { pend=false; good=false; }
        else if (pend) { good=false; }

        var state = bad ? 'cancelled' : (pend ? 'pending' : 'paid');
        document.documentElement.setAttribute('data-buy-return', state);

        // Only set data-buy-item when the return was a paid outcome.
        var token = String(q.get('item')||"").trim().toLowerCase();
        if (token && good) { document.documentElement.setAttribute('data-buy-item', token); }

        // Small banner text
        var namePart = token ? ' — ' + token : '';
        if (bad) {
          box.className = 'note note--warn';
          box.innerHTML = '<p class="note__title">Nothing was charged'+namePart+'</p><p>The checkout was cancelled.</p>';
        } else if (pend) {
          box.className = 'note';
          box.innerHTML = '<p class="note__title">Payment still being confirmed'+namePart+'</p><p>Payment is still settling. Do not pay again.</p>';
        } else {
          box.className = 'note note--good';
          box.innerHTML = '<p class="note__title">Payment received'+namePart+'</p><p>Thank you — your licence will arrive by email.</p>';
        }
        box.hidden = false;
        // Clean up URL keys so refreshes don't re-trigger highlight
        if (history.replaceState) {
          KEYS.forEach(function(k){ q.delete(k); });
          ['session_id','order','order_id','payment_intent','reference','ref','transaction_id','checkout_id'].forEach(function(k){ q.delete(k); });
          if (good || pend) q.delete('item');
          var rest = q.toString();
          history.replaceState(null,'', location.pathname + (rest ? '?'+rest : '') + location.hash);
        }
      } catch (e) { /* silent */ }
    })();
    </script>

    <script>
    (function () {
      // Render the group's store rows by fetching the real store API.
      var el = document.getElementById('group-store');
      if (!el) return;
      el.innerHTML = '<p role="status">Loading what\'s on sale…</p>';
      var ctrl = window.AbortController ? new AbortController() : null;
      var timer = setTimeout(function(){ if (ctrl) try{ ctrl.abort(); }catch(e){}; }, 12000);
      fetch('https://d8a.com/api/v1/store/items?group=batch-synthshop', ctrl ? { signal: ctrl.signal } : undefined)
        .then(function(r){ if (!r || !r.ok) throw new Error('bad'); return r.json(); })
        .then(function(s){
          if (!s || !s.items || !s.items.length) { el.innerHTML = '<p>Nothing for sale right now.</p>'; return; }
          el.innerHTML = s.items.map(function(it){
            return '<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid #e5e7eb">' +
              '<div style="flex:1"><b>'+escapeHtml(it.name)+'</b>' + (it.description? '<div style="font-size:12px;color:#6b7280">'+escapeHtml(it.description)+'</div>':'') + '</div>' +
              '<span>'+escapeHtml(it.price)+'</span>' +
              '<a href="'+escapeHtml(it.payUrl)+'" data-item="'+escapeHtml(it.id)+'">Buy</a></div>';
          }).join('') + '<p style="font-size:11px;color:#9ca3af">Sold by '+escapeHtml(s.group.name)+'</p>';
        })
        .catch(function(){ el.innerHTML = '<p>The shop could not be reached. <button type="button" onclick="location.reload()">Try again</button></p>'; });

      function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g,function(c){ return '&#'+c.charCodeAt(0)+';'; }); }
    })();
    </script>

    <!-- Just-bought marker: mark rows/cards only for paid returns (not pending) and show remembered buys. -->
    <script>
    (function(){
      var norm = function(s){ return String(s==null? '': s).trim().toLowerCase(); };
      var store = document.getElementById('group-store');
      if (!store) return;
      var KEY = 'soundshop:bought:v1';
      var MAX_AGE = 60 * 24 * 60 * 60 * 1000; // 60 days
      function read() { try { var raw = window.localStorage.getItem(KEY); if (!raw) return {}; var o = JSON.parse(raw); return (o && typeof o === 'object' && !(o instanceof Array)) ? o : {}; } catch (e) { return {}; } }
      function write(o) { try { window.localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} }
      function forget(tok){ var o=read(); if (Object.prototype.hasOwnProperty.call(o,tok)){ delete o[tok]; write(o); } }

      // Use data-buy-return but treat only paid as 'live' to be marked as just-paid.
      var ret = document.documentElement.getAttribute('data-buy-return');
      var live = (ret === 'paid') ? norm(document.documentElement.getAttribute('data-buy-item')) : '';

      // Build remembered items
      var REF_OK = /^[A-Za-z0-9_-]{1,128}$/;
      var saved = read(), pruned = false, items = {};
      for (var k in saved) {
        if (!Object.prototype.hasOwnProperty.call(saved,k)) continue;
        var rec = saved[k], obj = rec && typeof rec === 'object' && !(rec instanceof Array);
        var tok = norm(k), when = Number(obj ? rec.t : rec);
        var sref = obj ? String(rec.ref == null ? '' : rec.ref) : '';
        if (!REF_OK.test(sref)) sref = '';
        if (!tok || !isFinite(when) || when <=0 || (Date.now() - when) > MAX_AGE) { delete saved[k]; pruned = true; continue; }
        items[tok] = { when: when, live: false, ref: sref };
      }
      if (pruned) write(saved);
      if (live) { var prev = items[live]; items[live] = { when: 0, live: true, ref: prev ? prev.ref : '' }; }
      var tokens = Object.keys(items);

      if (Object.prototype.hasOwnProperty.call(items, 'bundle')) {
        var bundle = items['bundle'];
        var cards = document.querySelectorAll('[data-store-item]');
        for (var c=0;c<cards.length;c++){
          var ctok = norm(cards[c].getAttribute('data-store-item'));
          if (!ctok || ctok === 'bundle') continue;
          if (Object.prototype.hasOwnProperty.call(items, ctok)) continue;
          items[ctok] = { when: bundle.when, live: bundle.live, cover: 'bundle', ref: bundle.ref };
          tokens.push(ctok);
        }
      }
      if (!tokens.length) return;

      var NOTE = 'You just paid for this — your licence goes to the email you used. Only buy again if you mean to.';
      function dated(ms){ var d = new Date(ms); try { return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); } catch(e){ return d.toDateString(); } }
      var state = {};
      function slot(tok){ if (!state[tok]) state[tok] = { rowDone:false, cardDone:false, anchor:null, lines:[] }; return state[tok]; }
      function clear(tok){ forget(tok); var st = state[tok]; if (!st) return; for (var i=0;i<st.lines.length;i++){ var n = st.lines[i]; if (n && n.parentNode) n.parentNode.removeChild(n); } st.lines = []; if (st.anchor && norm(st.anchor.textContent) === 'buy again') st.anchor.textContent = 'Buy'; }
      function line(tok, gap){ var it = items[tok]; var p = document.createElement('p'); p.className = 'store-bought-line'; p.setAttribute('role','status'); p.style.margin = gap || '0'; var refPart = it.ref ? ' Reference ' + it.ref + ' — quote it if you contact us.' : ''; if (it.cover){ p.textContent = 'Included in The Full Shop bundle, ' + (it.live ? 'which you just paid for' : 'bought on this device on ' + dated(it.when)) + ' — only buy it separately if you mean to.' + refPart; slot(it.cover).lines.push(p); return p; } if (it.live){ p.textContent = NOTE + refPart; } else { p.textContent = 'Bought on this device on ' + dated(it.when) + ' — your licence went to the email you used. Only buy again if you mean to.' + refPart + ' '; var btn = document.createElement('button'); btn.type='button'; btn.className='store-bought-clear'; btn.style.cssText='font:inherit;color:#7c5cff;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline'; btn.textContent='Not you? Clear'; btn.addEventListener('click', function(){ clear(tok); }); p.appendChild(btn); } slot(tok).lines.push(p); return p; }

      function markRow(token){ var st = slot(token); if (st.rowDone) return true; var rows = store.querySelectorAll('a[data-item]'); if (!rows.length) return false; var hit = null; Array.prototype.forEach.call(rows, function(a){ if (hit) return; var row = a.parentNode, b = row ? row.querySelector('b') : null; if (norm(a.getAttribute('data-item')) === token || norm(b && b.textContent) === token) { hit = a; } }); if (!hit) return false; st.rowDone = true; if (!items[token].cover && norm(hit.textContent) === 'buy') { hit.textContent = 'Buy again'; st.anchor = hit; } var row = hit.parentNode; if (row && row.parentNode) { var next = row.nextSibling; var already = next && next.className && String(next.className).indexOf('store-bought-line') > -1; if (!already) { row.parentNode.insertBefore(line(token, '0 0 10px'), next); } } return true; }
      function markCard(token){ var st = slot(token); if (st.cardDone) return true; var btns = document.querySelectorAll('[data-store-item]'); for (var i=0;i<btns.length;i++){ if (norm(btns[i].getAttribute('data-store-item')) !== token) continue; st.cardDone = true; var box = btns[i].parentNode; if (box && !box.querySelector('.store-bought-line')) { box.insertBefore(line(token, '0'), btns[i]); } return true; } st.cardDone = true; return true; }

      var pass = function(){ var all=true; for (var i=0;i<tokens.length;i++){ if (markRow(tokens[i])) { markCard(tokens[i]); } else { all=false; } } return all; };
      if (pass()) return; if (!window.MutationObserver) return; var obs = new MutationObserver(function(){ if (pass()) obs.disconnect(); }); obs.observe(store, { childList:true, subtree:true }); setTimeout(function(){ obs.disconnect(); }, 15000);
    })();
    </script>

  </section>
</main>
</body>
</html>
