<html lang="en">
<head>

<meta name="description" content="The whole SOUNDSHOP rack: VANTA, DRIFT, PRISM and ANVIL.">

</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-head">
  <a class="brand" href="../index.html" aria-label="Soundshop home">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">SOUNDSHOP</span>
  </a>
  <nav class="site-nav" aria-label="Primary">
    <a href="../plugins/index.html">Plugins</a>
    <a href="../presets/index.html">Presets</a>
    <a href="../demo/flagship-demo.html">Demo</a>
    <a href="../docs.html">Docs</a>
    <a href="../changelog.html">Changelog</a>
  </nav>
</header>

<main id="main">
  <section class="section section--tight" id="overview">
    <div class="wrap--wide">
      <nav class="crumbs" aria-label="Breadcrumb">
        <ol>
          <li><a href="../index.html">Soundshop</a></li>
          <li aria-current="page">Plugins</li>
        </ol>
      </nav>

      <div class="sec-head mt-5">
        <span class="sec-head__eyebrow">The shop</span>
        <h1 class="sec-head__title">Four instruments, one signal philosophy</h1>
        <p class="sec-head__sub">Each one exists because we needed it and could not buy it. Built and maintained in-house.</p>
      </div>

      <!-- Placeholder: the plugin catalogue and bundle hero would be here. -->

      <div id="buy-return" aria-live="polite"></div>

      <!-- Payments widget from .d8a (rendered in the original site). -->
      <div id="group-store"></div>

    </div>
  </section>

  <script>
  (function () {
    // Replicate the buy-return handling from the original page but fixed.
    try {
      var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return "&#" + c.charCodeAt(0) + ";"; }); };
      (function () {
        var token = (location.search.match(/[?&]d8a_item=([a-z0-9._ -]+)/i) || [])[1] || '';
        token = String(token).trim().toLowerCase();
        var ref = (location.search.match(/[?&]d8a_ref=([A-Za-z0-9_-]+)/) || [])[1] || '';

        var itemName = "";
        if (token === "bundle") { itemName = "The Full Shop bundle"; }

        var namePart = itemName ? " — " + esc(itemName) : "";

        var refLine = ref
          ? '<p>Reference: <code style="font:12px ui-monospace,SFMono-Regular,Menlo,monospace">' + esc(ref) + '</code> — quote this if you contact us.</p>'
          : "";

        var note = '';
        var state = document.documentElement.getAttribute('data-buy-return');
        if (state === 'paid') {
          note = '<div class="note note--good" role="status" aria-live="polite">'
            + '<p class="note__title">Thanks — your purchase is confirmed' + namePart + '</p>'
            + '<div class="note__body"><p>Your licence will arrive by email shortly.' + (ref ? ' Reference: ' + esc(ref) : '') + '</p>'
            + (itemName ? '<p><a href="#" onclick="document.documentElement.removeAttribute(\'data-buy-item\');return false;">Hide</a></p>' : '')
            + '</div></div>';
        } else if (state === 'pending') {
          note = '<div class="note note--info" role="status" aria-live="polite">'
            + '<p class="note__title">Your payment is still being processed' + namePart + '</p>'
            + '<div class="note__body"><p>If this was you, wait a few moments and then reload this page. If it fails we will send an email.</p></div></div>';
        } else {
          // Fixed: single, well-quoted HTML string for the bad/cancelled return.
          note = '<div class="note note--bad" role="status" aria-live="polite">'
            + '<p class="note__title">Payment not completed</p>'
            + '<div class="note__body"><p>Your payment did not complete. No purchase was recorded.</p></div></div>';
        }

        var el = document.getElementById('buy-return');
        if (el) { el.innerHTML = note + refLine; }
      })();
    } catch (e) {
      // Keep silent: avoid breaking the rest of the page.
      console && console.error && console.error('buy-return script error', e);
    }
  })();
  </script>

</main>
</body>
</html>
