<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flagship Synth — Demo</title>
<style>
  body{font-family:sans-serif;margin:0;padding:12px;background:#111;color:#eee}
  h2{margin:0 0 4px;font-size:16px}
  #status{font-size:12px;opacity:.8;margin:0 0 10px}
  #keys{display:flex;gap:2px;margin:0 0 14px}
  .key{flex:1;height:80px;background:#eee;color:#111;border:1px solid #333;
       border-radius:0 0 4px 4px;cursor:pointer;user-select:none;
       display:flex;align-items:flex-end;justify-content:center;font-size:11px;padding-bottom:4px}
  .key.active{background:#4af}
  .controls{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
  .controls label{display:flex;flex-direction:column;font-size:11px;gap:2px}
</style>
</head>
<body>
  <h2>Flagship Synth — Playable Demo</h2>
  <p id="status">Click a key, or use your computer keyboard (A S D F G H J K). Click once first to enable audio.</p>
  <div id="keys"></div>
  <div class="controls">
    <label>Waveform
      <select id="wave">
        <option value="sawtooth" selected>Saw</option>
        <option value="sine">Sine</option>
        <option value="square">Square</option>
        <option value="triangle">Triangle</option>
      </select>
    </label>
    <label>Attack <input id="attack" type="range" min="0" max="1" step="0.01" value="0.02"></label>
    <label>Decay <input id="decay" type="range" min="0" max="1" step="0.01" value="0.1"></label>
    <label>Sustain <input id="sustain" type="range" min="0" max="1" step="0.01" value="0.7"></label>
    <label>Release <input id="release" type="range" min="0" max="2" step="0.01" value="0.3"></label>
    <label>Filter cutoff <input id="cutoff" type="range" min="200" max="8000" step="10" value="4000"></label>
  </div>
  <div class="controls">
    <label>Preset
      <select id="preset"><option value="">Loading…</option></select>
    </label>
  </div>
  <script src="flagship-demo.js"></script>
</body>
</html>
