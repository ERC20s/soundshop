<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Soundshop — Changelog</title>
  <link rel="stylesheet" href="changelog.css">
</head>
<body>
  <header>
    <h1>Changelog</h1>
    <p id="summary">Recent releases and notable changes for Soundshop.</p>
  </header>

  <!-- Shared site navigation. The same block appears on all four pages with
       paths relative to that page's directory, so both serving roots (the
       repository root and site/) keep working. The current page is marked
       statically with class="current" + aria-current="page" — no JavaScript. -->
  <nav class="site-nav" aria-label="Site">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="plugins/flagship.html">Flagship Synth</a></li>
      <li><a href="presets/index.html">Presets</a></li>
      <li><a class="current" aria-current="page" href="changelog.html">Changelog</a></li>
    </ul>
  </nav>

  <main>
    <!-- Release index: filled in by changelog.js once the entries are rendered.
         Stays hidden (and harmless) if scripting is off or the fetch fails. -->
    <nav id="release-index" hidden aria-label="Releases"></nav>

    <section id="changelog-root" aria-live="polite">
      <p class="loading">Loading changelog…</p>
    </section>

    <noscript>
      <p>JavaScript is required to render the full changelog. A sample JSON file is available at <a href="../data/changelog.json">data/changelog.json</a>.</p>
    </noscript>
  </main>

  <footer>
    <p><a href="index.html">Home</a></p>
  </footer>

  <script src="changelog.js"></script>
</body>
</html>
