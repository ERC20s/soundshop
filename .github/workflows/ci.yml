name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # npm test runs every tools/check-*.js and tools/test-*.js (including
      # check-site-integrity.js: fragments, runtime assets, plugin pages) and
      # exits non-zero if any of them fails.
      - name: Checks and tests
        run: npm test

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # tests/e2e: home -> plugin page -> play a note -> Buy button, every
      # plugin page at 1280 and 390 px with no console errors, keyboard-only
      # play on every keybed, and the engine's real output checked for clicks.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
