name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # npm test runs every tools/check-*.js and tools/test-*.js and exits
      # non-zero if any of them fails.
      - name: Checks and tests
        run: npm test
